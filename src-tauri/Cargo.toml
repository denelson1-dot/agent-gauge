[package]
name = "agent-gauge"
version = "0.4.0"
description = "A local AI subscription usage widget for Linux and Windows"
authors = ["Dave"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_gauge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-runtime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sha2 = "0.10"
hex = "0.4"
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The widget surface is drawn directly with GTK/Cairo on Linux; see
# platform::widget for why the webview is not used there.
gtk = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
# Start-at-login is a value under the per-user Run key.
winreg = "0.52"
# Desktop mode reparents the widget into Explorer's wallpaper window, which has
# no equivalent in the cross-platform window API.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
